services:
  - type: web
    name: gart-gallery
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: gart-gallery-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gart-gallery-db
          property: connectionString
      - key: DB_PATH
        value: /var/data/gallery.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: ADMIN_USER
        value: admin
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: gart-gallery-db
    plan: free
